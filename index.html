<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <title>Magic Frame Free v7.2</title>
</head>
<body>
  <main id="app">
    <section class="stage">
      <video id="video" playsinline muted></video>
      <canvas id="canvas"></canvas>
      <canvas id="fxCanvas" hidden></canvas>
      <div id="status" class="status">Ładowanie JS…</div>
      <div id="diag" class="diag">JS: … · kamera: — · dłonie: — · twarz: — · FX: —</div>
    </section>

    <section class="controls">
      <button id="startBtn" class="primary">Uruchom kamerę</button>
      <select id="effectSelect" aria-label="Efekt obrazu">
        <optgroup label="Twarz + scena">
          <option value="anime">Anime Toon</option>
          <option value="comic">Comic Toon</option>
          <option value="clay">Clay Toon</option>
        </optgroup>
        <optgroup label="Scena">
          <option value="cyber">Cyberpunk</option>
          <option value="glitch">Glitch</option>
          <option value="bw">B&amp;W Ink</option>
        </optgroup>
      </select>
      <label class="toggle"><input id="debugToggle" type="checkbox" /> Debug tracking</label>
    </section>

    <section class="help">
      <p><strong>v7.2:</strong> cztery końcówki palców sterują swobodnym quadem bez wymuszania kątów 90°. Kształt może być trapezem, wklęsły albo samoprzecinający jak <code>|&gt;&lt;|</code>. Każdy narożnik śledzony jest osobno z minimalnym opóźnieniem. Bez płatnego API.</p>
      <p id="errorDetails" class="error-details" hidden></p>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
